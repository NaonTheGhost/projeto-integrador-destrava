<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cadastro de empresa</title>
	<link rel="stylesheet" href="../assets/CSS/cadastro-e-login.css">
</head>
<body>
	<main id="conteudo-cadastro">
		<div class="bloco bloco-cadastro">
			<div class="cadastro-marca">

			</div>
			<h1>Cadastrar empresa</h1>

			<form id="form" action="#" method="post">
				<div class="campo">
					<label for="input-nome-empresa">Nome da empresa</label>
					<input type="text" id="input-nome-empresa" name="nomeEmpresa" autocomplete="organization" required>
				</div>

				<div class="campo">
					<label for="input-cnpj-empresa">CNPJ</label>
					<input type="text" id="input-cnpj-empresa" name="cnpj" inputmode="numeric" placeholder="00.000.000/0000-00" required>
				</div>

				<div class="campo">
					<label for="input-email-empresa">E-mail corporativo</label>
					<input type="email" id="input-email-empresa" name="email" autocomplete="email" required>
				</div>

				<div class="campo">
					<label for="input-telefone-empresa">Telefone</label>
					<input type="tel" id="input-telefone-empresa" name="telefone" autocomplete="tel">
				</div>

				<div class="campo">
					<label for="input-senha-empresa">Senha</label>
					<input type="password" id="input-senha-empresa" name="senha" autocomplete="new-password" required>
				</div>

				<div class="campo">
					<label for="input-confirmar-senha-empresa">Confirme sua senha</label>
					<input type="password" id="input-confirmar-senha-empresa" name="confirmarSenha" autocomplete="new-password" required>
				</div>

				<div class="campo campo-checkbox">
					<label class="campo-checkbox">
						<input type="checkbox" id="input-termos-empresa" name="termos" required>
						Li e aceito os <a href="#">termos de serviço</a>
					</label>
				</div>
				<br>
				<button type="submit">Cadastrar empresa</button>
			</form>

			<p class="cadastro-login">
				Já tem uma conta? <a href="../index.html">Entrar</a>
			</p>
			<p class="cadastro-login">
				<a href="inicio-empresas.html">Voltar ao portal de empresas</a>
			</p>
		</div>
	</main>

	<script src="../assets/JS/cadastro-e-login.js"></script>
</body>
</html>
