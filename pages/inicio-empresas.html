<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início Empresas</title>
    <link rel="stylesheet" href="../assets/CSS/style.css">
</head>
<body>
    <main class="contado-cadastro">
        <div class="bloco bloco-cadastro">
            
            <!-- Cabeçalho / Título da página -->
            <div class="cadastro-marca">
                <h1>Portal de Empresas</h1>
            </div>

            <!-- Apresentação -->
            <div class="campo-cadastro">
                <label>Conecte sua empresa aos novos talentos do mercado</label>
            </div>

            <!-- Informações e Vantagens -->
            <div class="campo-cadastro">
                <label>Vantagens da plataforma:</label>
                <ul>
                    <li>Mapeamento de competências e habilidades</li>
                    <li>Acompanhamento do progresso dos jovens</li>
                    <li>Acesso a candidatos qualificados</li>
                </ul>
            </div>

            <!-- Botão de Ação / Link para Cadastro -->
            <div class="campo-cadastro">
                <label>Já tem uma conta ou quer cadastrar sua empresa?</label>
                <a href="cadastro-empresas.html">
                    <button type="button">Cadastrar empresa</button>
                </a>
            </div>

        </div>
    </main>
</body>
</html>
